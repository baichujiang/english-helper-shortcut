<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文助手 · 真机验收</title><style>body{font:18px -apple-system;margin:24px;line-height:1.6;background:#f4f7fc;color:#152338}a,button{display:block;padding:14px;margin:14px 0;font:inherit;border:0;border-radius:12px;background:#1478ee;color:white;text-align:center;touch-action:manipulation}textarea{box-sizing:border-box;width:100%;height:210px;font:20px -apple-system;padding:16px;border:1px solid #b8c6d9;border-radius:12px}#status{min-height:30px}</style><h1>英文助手 · 真机验收</h1><p>只使用合成测试句。看到“已复制”后点小白点，预览并确认，再在下面选中原文粘贴。</p><textarea id="draft">She don't like coffee.</textarea><button onclick="copyDraft()">复制框内测试句</button><button onclick="setFixture(0)">填入语法测试句</button><button onclick="setFixture(1)">填入润色测试句</button><p id="status"></p><a href="%E8%8B%B1%E6%96%87%E5%8A%A9%E6%89%8B%20v1.1.shortcut">下载正式版 v1.1</a><a href="English%20Helper%20QA.shortcut">下载验收工具</a><script>const draft=document.getElementById('draft');function setFixture(i){draft.value=["She don't like coffee.","I want to ask you if you can send me the file when you have time."][i];document.getElementById('status').textContent='已填入合成测试句。';}function copyDraft(){const message=document.getElementById('status');message.textContent='正在复制…';try{draft.focus();draft.select();draft.setSelectionRange(0,draft.value.length);const ok=document.execCommand('copy');message.textContent=ok?'已复制。现在可点小白点。':'自动复制未成功，请在文本中全选并手动复制。';}catch(error){message.textContent='自动复制未成功（'+error.name+'），请在文本中全选并手动复制。';}}</script></html>
